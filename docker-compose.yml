services:
  mysql:
    image: mysql:8.4
    container_name: mplan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS:-mplan}
      MYSQL_DATABASE: mplan
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - '3308:3306'
    volumes:
      - mplan_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${MYSQL_ROOT_PASS:-mplan}']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mplan_mysql: